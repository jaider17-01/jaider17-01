<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Jaider Jaimes — Software Developer</title>
  <desc id="desc">Banner de perfil con estética tecnológica oscura, acentos azules y una ventana de código.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="55%" stop-color="#0b1f3a"/>
      <stop offset="100%" stop-color="#102f55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8bb7e8" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <circle cx="1050" cy="70" r="160" fill="#2563eb" opacity=".10"/>
  <circle cx="1090" cy="290" r="190" fill="#38bdf8" opacity=".07"/>
  <path d="M0 280 C240 220 370 360 620 285 S980 230 1200 270" fill="none" stroke="url(#accent)" stroke-opacity=".35" stroke-width="2"/>
  <rect x="68" y="62" width="5" height="214" rx="2.5" fill="url(#accent)"/>
  <text x="100" y="112" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="3">SOFTWARE DEVELOPER · COLOMBIA</text>
  <text x="96" y="174" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="49" font-weight="700">Jaider Jaimes</text>
  <text x="100" y="214" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">Java · Spring Boot · Flutter · APIs REST</text>
  <text x="100" y="250" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Ingeniería de Sistemas en formación · UTS</text>
  <g transform="translate(770 75)">
    <rect width="345" height="184" rx="13" fill="#07111f" fill-opacity=".82" stroke="#60a5fa" stroke-opacity=".32"/>
    <path d="M0 39H345" stroke="#64748b" stroke-opacity=".35"/>
    <circle cx="20" cy="20" r="4" fill="#fb7185"/>
    <circle cx="35" cy="20" r="4" fill="#fbbf24"/>
    <circle cx="50" cy="20" r="4" fill="#34d399"/>
    <text x="20" y="68" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">class Developer {</text>
    <text x="37" y="94" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">buildSolutions();</text>
    <text x="37" y="120" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">learnContinuously();</text>
    <text x="20" y="146" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">}</text>
    <rect x="20" y="160" width="92" height="3" rx="1.5" fill="url(#accent)"/>
  </g>
  <text x="1090" y="316" text-anchor="end" fill="#93a4bb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">BUILD • LEARN • IMPROVE</text>
</svg>