<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Jaider Jaimes | Software Developer</title>
  <desc id="desc">Banner profesional con identidad visual oscura, tipografía editorial, acentos cian y violeta y una interfaz de código estilizada.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="52%" stop-color="#101b32"/>
      <stop offset="100%" stop-color="#17264a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#a5c5ff" stroke-opacity=".075" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#a5c5ff" fill-opacity=".18"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
  </defs>
  <rect width="1200" height="390" rx="24" fill="url(#background)"/>
  <rect width="1200" height="390" rx="24" fill="url(#grid)"/>
  <ellipse cx="1000" cy="115" rx="210" ry="120" fill="#2563eb" opacity=".18" filter="url(#blur)"/>
  <ellipse cx="1090" cy="310" rx="180" ry="105" fill="#7c3aed" opacity=".14" filter="url(#blur)"/>
  <path d="M0 320 C210 270 370 375 610 310 S950 275 1200 300" fill="none" stroke="url(#line)" stroke-width="2"/>
  <path d="M0 333 C230 282 385 388 625 323 S960 290 1200 315" fill="none" stroke="#60a5fa" stroke-opacity=".12" stroke-width="1"/>
  <rect x="62" y="58" width="4" height="250" rx="2" fill="url(#glow)"/>
  <text x="88" y="82" fill="#7dd3fc" font-family="SFMono-Regular,Consolas,monospace" font-size="14" letter-spacing="3">SOFTWARE ENGINEERING / COLOMBIA</text>
  <text x="82" y="151" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="750" letter-spacing="-1.5">Jaider Jaimes</text>
  <text x="88" y="191" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Backend development · APIs · Multiplatform apps</text>
  <rect x="88" y="216" width="405" height="1" fill="#64748b" opacity=".6"/>
  <text x="88" y="246" fill="#a5b4fc" font-family="SFMono-Regular,Consolas,monospace" font-size="15">JAVA  /  SPRING BOOT  /  FLUTTER</text>
  <text x="88" y="280" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Ingeniería de Sistemas · UTS</text>
  <g transform="translate(690 75)">
    <rect x="0" y="0" width="430" height="226" rx="15" fill="#080e1c" fill-opacity=".92" stroke="#93c5fd" stroke-opacity=".25"/>
    <path d="M0 43H430" stroke="#64748b" stroke-opacity=".3"/>
    <circle cx="22" cy="21" r="4.5" fill="#fb7185"/>
    <circle cx="39" cy="21" r="4.5" fill="#fbbf24"/>
    <circle cx="56" cy="21" r="4.5" fill="#34d399"/>
    <text x="78" y="25" fill="#64748b" font-family="SFMono-Regular,Consolas,monospace" font-size="11">solution.java</text>
    <text x="24" y="75" fill="#64748b" font-family="SFMono-Regular,Consolas,monospace" font-size="12">01</text>
    <text x="53" y="75" fill="#c4b5fd" font-family="SFMono-Regular,Consolas,monospace" font-size="14">public class Developer {</text>
    <text x="24" y="105" fill="#64748b" font-family="SFMono-Regular,Consolas,monospace" font-size="12">02</text>
    <text x="53" y="105" fill="#7dd3fc" font-family="SFMono-Regular,Consolas,monospace" font-size="14">  buildSolutions();</text>
    <text x="24" y="135" fill="#64748b" font-family="SFMono-Regular,Consolas,monospace" font-size="12">03</text>
    <text x="53" y="135" fill="#86efac" font-family="SFMono-Regular,Consolas,monospace" font-size="14">  learnContinuously();</text>
    <text x="24" y="165" fill="#64748b" font-family="SFMono-Regular,Consolas,monospace" font-size="12">04</text>
    <text x="53" y="165" fill="#7dd3fc" font-family="SFMono-Regular,Consolas,monospace" font-size="14">  improveEveryDay();</text>
    <text x="24" y="195" fill="#64748b" font-family="SFMono-Regular,Consolas,monospace" font-size="12">05</text>
    <text x="53" y="195" fill="#c4b5fd" font-family="SFMono-Regular,Consolas,monospace" font-size="14">}</text>
    <rect x="310" y="187" width="88" height="3" rx="1.5" fill="url(#glow)"/>
  </g>
  <text x="1115" y="356" text-anchor="end" fill="#94a3b8" font-family="SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="2">BUILD / LEARN / IMPROVE</text>
